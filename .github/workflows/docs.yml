name: Documentation

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs_hooks.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Read Pages configuration
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        id: pages
        uses: actions/configure-pages@v5
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || steps.pages.outputs.base_url }}
          DOCS_REPO_URL: ${{ vars.DOCS_REPO_URL }}
          DOCS_SOURCE_REF: ${{ vars.DOCS_SOURCE_REF || github.event.repository.default_branch }}
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
