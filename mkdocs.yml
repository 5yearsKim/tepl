site_name: TEPL
site_description: Write, check, and run tensor graph rewrites with semantic verification and automatic axis attributes.
site_url: !ENV [DOCS_SITE_URL, ""]
repo_url: https://github.com/5yearsKim/tepl
edit_uri: edit/main/docs/

extra:
  source_branch: main

hooks:
  - tools/docs_hooks.py

exclude_docs: |
  documentation.md
  paper_outline.md
  soundness_proof.md

theme:
  name: material
  logo: assets/images/logo/tepl_192.png
  favicon: assets/images/logo/tepl_favicon.ico
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Getting started:
      - What is TEPL?: getting-started/what-is-tepl.md
      - Install TEPL: getting-started/install.md
      - Your first rewrite: getting-started/first-rewrite.md
  - Writing rewrites:
      - Basic:
          - Dialects, rules, and graphs: language/core-concepts.md
          - Shapes and dtypes: language/tensors.md
          - Attributes and conditions: language/attributes-and-conditions.md
      - Advanced:
          - Semantic verification: language/semantics.md
          - Automatic axis attributes: language/axis-inference.md
          - Reusable rules: language/reusable-rules.md
          - Design philosophy: design_philosophy.md
  - Runtime integration:
      - Choosing a runtime: runtime/index.md
      - TEPL engine:
          - Run rewrites: runtime/engine/run.md
          - Embed the engine: runtime/engine/embed.md
      - E-graphs:
          - How e-graphs work: runtime/egraphs/overview.md
          - Tensor analysis and rewrite safety: runtime/egraphs/analysis.md
          - Binding and rule evaluation: runtime/egraphs/binding.md
          - egg (Rust):
              - Run generated rules: runtime/egraphs/rust/run.md
              - Supply tensor metadata: runtime/egraphs/rust/analysis.md
          - egg-c (C++):
              - Set up the application: runtime/egraphs/cpp/setup.md
              - Run generated rules: runtime/egraphs/cpp/run.md
              - Supply tensor metadata: runtime/egraphs/cpp/analysis.md
  - Reference:
      - CLI: references/cli.md
      - Shapes: references/shape.md
      - Dtypes: references/dtype.md
      - Rule expressions and descriptors: references/rule-expressions.md
      - Scalar semantics: references/scalar-semantics.md
      - Metadata reasoning: references/metadata-reasoning.md
      - Built-in functions: references/built-ins.md
      - Compiled program format: references/program-format.md
  - Contributing:
      - Developer guide: developer_guide.md

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
